[package]
name = "protonwire-daemon"
description = "ProtonWire privileged host: a thin root daemon around protonwire-core serving the frontend API over a Unix socket (PRD 6.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "protonwire-daemon"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
# IT-32's protun stderr logger (the m4-exit harness's pattern).
log = { workspace = true }
# IT-32's mocked WireGuard responder (the M4-exit pattern).
proton-boringtun = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
rtnetlink = { workspace = true }
protonwire-net = { workspace = true }
protonwire-store = { workspace = true }

[dependencies]
# SIGTERM/SIGINT/SIGHUP/SIGQUIT flag handler (M2 S12) — the TUI's R7-4
# pattern. The workspace's pinned nix entry already enables the
# "signal" feature (the reserved feature this unit consumes), so no
# root Cargo.toml change and no version change.
nix = { workspace = true }
# M2 S9: the adapter TRAIT surface only (CatalogApi, AuthenticationApi,
# ApiError) for the daemon-side bridges — the engine/runtime wiring
# (constructing MuonAuth/MuonCatalog) belongs to the session lane and
# installs through the provider cells in `services.rs`. The daemon is a
# server-side app, so the client-side dep gate (frontends reach the
# service only through protonwire-client) does not apply to this edge.
protonwire-api = { workspace = true }
protonwire-core = { workspace = true }
protonwire-protocol = { workspace = true }
protonwire-frontend-api = { workspace = true }
protonwire-ipc = { workspace = true }
protonwire-store = { workspace = true }
# M6 slice 1b: the lane composition — the M5 session orchestrator,
# the kill switch, and the mark allocator (all already in-graph via
# the netns IT harness's dependency on protonwire-net).
protonwire-net = { workspace = true }
rtnetlink = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# M3 U6: the FR-22 elimination report rides `RpcError::details` as
# structured JSON (already everywhere in the lockfile).
serde_json = { workspace = true }
# M3 U6: the random selection policy's caller-supplied entropy — the
# same OS-CSPRNG dependency core's scheduler uses (m2-plan decision 3;
# the workspace 0.3 pin — this crate's stray 0.2 copy unified in M6 1b).
getrandom = { workspace = true }
