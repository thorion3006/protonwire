schema_version: 3

baseline:
  as_of: "2026-08-14"
  rule: >-
    Union of Proton VPN service capabilities exposed by maintained official
    clients when the behavior is technically applicable to Linux or a headless
    frontend. Platform-specific presentation is not copied literally.
  implementation_status: planning
  evidence_status: provisional-capability-inventory
  release_gate: complete-capability-diff-against-every-pinned-platform-baseline
  refresh_policy: every-protonwire-release-and-every-protun-or-muon-upgrade

client_contract:
  architecture_as_of: "2026-08-14"
  required_v1_clients: [cli, tui, gui]
  implementations:
    cli: clap
    tui: ratatui
    gui: tauri
  rule: >-
    Every required interactive core capability must be exposed through CLI,
    TUI, and GUI using the shared client SDK. Automation-only formatting and
    presentation-only desktop or terminal behavior must be explicit exceptions.
  authoritative_behavior_owner: protonwire-core
  capability_defaults:
    interactive_client_surfaces: [cli, tui, gui]
    override_field: client_exceptions
    last_evidence_reviewed_at: "2026-08-14"
    known_semantic_differences: []
    verified_requires_per_capability_field: verified_at

upstream:
  protun:
    version: 2.2.1
    revision: 12e7755a112f59b7b843da79290b3de25febf653
    source: https://github.com/ProtonVPN/protun/tree/v2.2.1
    license: GPL-3.0-or-later
  muon:
    version: 2.6.1
    source: https://rust-registry.proton.me/downloads/muon@2.6.1.crate
    checksum_sha256: be9ba1f347e00a86119ff6b70d36356cce28c33fd000290cc1254bf4048155de
    license: unresolved-release-blocker
    license_evidence: no-license-field-or-license-file-in-source-archive
  pvpnclient:
    version: 3.0.3
    version_constraint_from_protun: ~3.0.1
    source: https://rust-registry.proton.me/downloads/pvpnclient@3.0.3.crate
    checksum_sha256: 3c14ef052727e0204ec5e80cf8df50786db38a83b6a6557a188b78a4c264f380
    license: unresolved-release-blocker
    license_evidence: no-license-field-or-license-file-in-source-archive
  official_linux_cli:
    revision: a7c7abc8d3777f33b8d4c82279bd621258bd810d
    source: https://github.com/ProtonVPN/proton-vpn-cli
  official_linux_gui:
    revision: bd9c406befad847d613ba3fc634b0f0ea9f1a72e
    source: https://github.com/ProtonVPN/proton-vpn-gtk-app
  official_linux_api_core:
    revision: fb35f610fc592ddc181230369dc59855c4f97a04
    source: https://github.com/ProtonVPN/python-proton-vpn-api-core
  official_android_app:
    revision: cc1e29f8acd5f11f63701b48f97410e90fa6a71d
    source: https://github.com/ProtonVPN/android-app
  official_windows_app:
    revision: 4d9ac60d1db5d3f2908498470a9d1646723afcfd
    branch: master
    source: https://github.com/ProtonVPN/win-app
  official_apple_app:
    revision: 6973fc1f7703314d80cada3eba377766c55710e5
    branch: develop
    platforms: [ios, ipados, macos]
    source: https://github.com/ProtonVPN/ios-mac-app

status_definitions:
  required: Applicable v1 scope; not yet verified complete.
  implemented: Implemented but not yet fully parity-verified.
  verified: Meets PRD parity definition and all referenced tests pass.
  blocked-upstream: Public and authorized ProTUN, Muon, or Proton API surface is insufficient; approximation is forbidden and referenced tests cover fail-closed behavior only.
  not-applicable: Platform-only presentation has no Linux/headless equivalent.
  legacy-excluded: Intentionally outside the Proton Protocols architecture.

