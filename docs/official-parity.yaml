    owner: protonwire-core
    entitlement: plan-dependent
    sources: [android_fastest_exclusion, android_physical_country, windows_release_notes, connection_groups_contract]
    tests: [T-29, T-31, IT-24, E2E-23]

  - id: groups.anti-censorship
    area: connection-groups
    status: required
    behavior: >-
      Official-compatible Anti-censorship preset using Stealth and Fastest
      selection after excluding the pre-VPN physical country.
    owner: protonwire-core
    entitlement: target-and-feature-dependent
    sources: [android_initial_profiles, android_fastest_exclusion, protun_repo, connection_groups_contract]
    tests: [T-29, T-31, IT-24, E2E-23]

  - id: groups.regional-fastest
    area: connection-groups
    status: required
    behavior: >-
      ProtonWire-added Fastest Africa, Asia, Europe, North America, South
      America, and Oceania over a checksummed UN M49 mapping and the
      authoritative visible server subset, ranked by Proton score by default,
      without estimated speed.
    owner: protonwire-core
    entitlement: paid-location-selection
    sources: [un_m49, streamlined_server_lists, connection_groups_contract]
    tests: [T-28, T-30, T-31, T-33, IT-24, E2E-24]

  - id: groups.cross-client-parity
    area: connection-groups
    status: required
    behavior: >-
      CLI, Ratatui TUI, and Tauri GUI expose the same group IDs, provenance,
      availability, detail, connect, pin, and copy-to-profile operations.
    owner: protonwire-client
    entitlement: protonwire-added
    sources: [connection_groups_contract, protonwire_adr, protonwire_prd]
    tests: [T-24, T-28, IT-21, IT-24, E2E-23, E2E-24]

  - id: servers.location
    area: servers
    status: required
    behavior: Country, state/region, city, and fastest within scope.
    owner: protonwire-core
    entitlement: paid-location-selection
    sources: [profiles, linux_cli]
    tests: [T-2, E2E-4]

  - id: servers.exact
    area: servers
    status: required
    behavior: Exact logical/physical server selection with no silent fallback.
