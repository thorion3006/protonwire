    tests: [T-4, T-25, T-26, IT-23, E2E-2, E2E-22]

  - id: servers.metadata-refresh-budget
    area: servers
    status: required
    behavior: Single-flight conditional catalog refresh with a hard three-hour automatic minimum, persisted deadline, positive jitter, warned/confirmed manual override, and Proton rate-limit suppression.
    owner: protonwire-core
    entitlement: protonwire-added
    sources: [protonwire_prd]
    tests: [T-25, T-26, T-27, IT-23, E2E-2, E2E-22]

  - id: servers.fastest-and-random
    area: servers
    status: required
    behavior: Official Fastest by Proton catalog Score and official random/exclusion behavior, with separate explicit ProtonWire balanced/load/measured-latency policies.
    owner: protonwire-core
    entitlement: plan-dependent
    sources: [profiles, default_connection, linux_cli, android_release_notes, android_fastest_exclusion]
    tests: [T-1, T-16, T-34, E2E-3, E2E-15]

  - id: groups.official-built-ins
    area: connection-groups
    status: required
