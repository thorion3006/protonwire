capabilities:
  - id: account.login
    area: account
    status: required
    behavior: Proton account login through Muon without persisting a raw password by default.
    owner: protonwire-api
    entitlement: all-authenticated-plans
    sources: [protun_repo, linux_cli]
    tests: [T-15, E2E-1, E2E-12]

  - id: account.session
    area: account
    status: required
    behavior: Encrypted session persistence, refresh, expiry recovery, and logout through Muon.
    owner: protonwire-api
    entitlement: all-authenticated-plans
    sources: [protun_repo, linux_cli]
    tests: [T-10, T-12, T-35, IT-29, IT-30, E2E-1, E2E-25]

  - id: account.credential-lifecycle
    area: account
    status: required
    behavior: >-
      Separate read-only systemd credential input from writable keyring-agent,
      TPM2, and encrypted-local session stores; expose durable-write health and
      never treat LoadCredential as a migration target or replay stale
      provisioned state over a newer writable session.
    owner: protonwire-store
    entitlement: protonwire-added
    sources: [systemd_credentials, protonwire_prd, protonwire_adr]
    tests: [T-12, T-35, IT-29, IT-30, E2E-25]

  - id: account.two-factor
    area: account
    status: required
    behavior: TOTP/recovery-code and FIDO2/WebAuthn 2FA plus VPN connection 2FA/jail states.
    owner: protonwire-api
    entitlement: account-configured
    sources: [two_factor, linux_cli, linux_release_notes]
    tests: [T-15, IT-15, E2E-12, E2E-19]

  - id: account.human-verification
    area: account
    status: blocked-upstream
    behavior: Safe browser handoff and continuation for Proton human-verification challenges.
    owner: protonwire-api
    entitlement: challenge-dependent
    sources: [protun_repo]
    tests: [T-15, E2E-12]
    blocker: Pinned Muon 2.6.1 has no public actionable human-verification event or continuation flow.

  - id: account.sso
    area: account
    status: blocked-upstream
    behavior: Proton organization SSO initiation, nonce-bound browser handoff, and session import/fork completion.
    owner: protonwire-api
    entitlement: proton-business-organization
    sources: [sso, apple_app, macos_release_notes]
    tests: [T-15, E2E-12]
    blocker: Confirm an authorized public SSO initiation/completion contract and client identifier.

  - id: account.guest-mode
    area: account
    status: blocked-upstream
    behavior: Ephemeral no-account session equivalent to official Android guest mode.
    owner: protonwire-api
    entitlement: free
    sources: [features]
    tests: [T-15]
    blocker: Confirm and document a public Muon/API guest-session flow for Linux.

  - id: account.entitlements-and-jails
    area: account
    status: required
    behavior: Plan, organization, disabled-user, pending-invoice, low-plan, and session-limit state.
    owner: protonwire-api
    entitlement: all
    sources: [protun_repo, linux_cli]
    tests: [T-4, IT-15, E2E-17]

  - id: security.upstream-secret-logging
    area: security
    status: required
    behavior: >-
      Suppress secret-bearing pinned dependency events before formatting,
      prohibit production dependency trace, and prove all sinks clean with
      password/TOTP/FIDO/session/fork/cookie/key canaries.
    owner: protonwire-daemon
    entitlement: protonwire-added
    sources: [protonwire_prd, proton_registry]
    tests: [T-32, E2E-25]

  - id: protocol.smart
    area: protocols
    status: required
    behavior: ProTUN automatically selects and falls back among eligible transports and ports.
    owner: protonwire-protocol
    entitlement: all
    sources: [protocols, smart_protocol, protun_repo]
    tests: [T-13, IT-14, E2E-13]

  - id: protocol.wireguard-udp
    area: protocols
    status: required
    behavior: Manual and Smart Protocol WireGuard UDP through ProTUN.
    owner: protonwire-protocol
    entitlement: all
    sources: [protocols, protun_repo]
    tests: [T-13, IT-14, E2E-13]

  - id: protocol.wireguard-tcp
    area: protocols
    status: required
    behavior: Manual and Smart Protocol WireGuard TCP through ProTUN.
    owner: protonwire-protocol
    entitlement: all
    sources: [protocols, protun_repo]
    tests: [T-13, IT-14, E2E-13]

  - id: protocol.stealth
    area: protocols
    status: required
    behavior: Manual and Smart Protocol Stealth through ProTUN TLS-port candidates.
    owner: protonwire-protocol
    entitlement: all
    sources: [protocols, protun_repo]
    tests: [T-13, IT-14, E2E-13]

  - id: protocol.network-change
    area: protocols
    status: required
    behavior: Up, down, and network-switch events reset ProTUN outer sockets safely.
