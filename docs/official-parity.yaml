    owner: protonwire-core
    entitlement: target-and-feature-dependent
    sources: [android_initial_profiles, profiles, default_connection, connection_groups_contract]
    tests: [T-28, T-29, IT-24, E2E-23]

  - id: groups.fastest-excluding-my-country
    area: connection-groups
    status: required
    behavior: >-
      Exclude the known pre-VPN physical country before selecting an eligible
