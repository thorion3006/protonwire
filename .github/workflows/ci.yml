name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Default members exclude the GUI (needs webkit system libraries;
      # the gui job builds it with them installed).
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --locked fails the job if Cargo.lock is missing or would change,
      # enforcing the single committed root lockfile (PRD FR-127A).
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      # Floor = lowest VERIFIED toolchain (PRD NFR-42's 1.85 minimum is not
      # reachable: Proton registry crates need ~1.94+; 1.85/1.88/1.89/1.90/
      # 1.93 probes all failed — see docs/spike-2026-08.md). Re-probe lower
      # versions at every engine upgrade.
      - run: cargo check --locked --all-targets

  xtask:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Parity manifest + connection-group catalog + M49 snapshot +
      # dependency-graph + generated-schema validation (T-19, T-23, T-28,
      # T-30 groundwork).
      - run: cargo run -p xtask -- all

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Flags known-vulnerable versions in the committed lockfile,
      # including the pinned Proton crates. --file makes policy application
      # explicit rather than relying on discovery from the repo root.
      - run: cargo audit --file .cargo/audit.toml

  doc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install webkit2gtk and GTK system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev
      # The GUI is a workspace member (covered by the root lockfile) but
      # not a default member; this job is its compile gate.
      - run: cargo clippy -p protonwire-gui --all-targets -- -D warnings
