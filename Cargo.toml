[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/frontend-api",
    "crates/client",
    "crates/ipc",
    "crates/api",
    "crates/protocol",
    "crates/net",
    "crates/policy",
    "crates/port-forwarding",
    "crates/store",
    "apps/daemon",
    "apps/credential-agent",
    "apps/cli",
    "apps/tui",
    "apps/gui/src-tauri",
    "xtask",
]
# The Tauri GUI needs webkit2gtk/glib system libraries to compile, so it is a
# workspace member (covered by this single root Cargo.lock) but not a default
# member. CI builds it in a dedicated job with the required system packages.
# `cargo build` at the workspace root builds everything except the GUI.
default-members = [
    "crates/core",
    "crates/frontend-api",
    "crates/client",
    "crates/ipc",
    "crates/api",
    "crates/protocol",
    "crates/net",
    "crates/policy",
    "crates/port-forwarding",
    "crates/store",
    "apps/daemon",
    "apps/credential-agent",
    "apps/cli",
    "apps/tui",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Floor = lowest VERIFIED toolchain. PRD NFR-42 sets a 1.85 minimum; the
# Proton registry crates (proton-vpn-netstack, proton-vpn-yaourt) use
# language features that do not compile before ~1.94: probes of 1.85, 1.88,
# 1.89, 1.90, and 1.93 all failed (details in docs/spike-2026-08.md).
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/thorion3006/protonwire"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
# --- Pinned Proton engines ------------------------------------------------
# ProTUN pin (tag v3.0.1 — GPLv3 LICENSE, the OQ-2 clearance). The tag carries
# no upstream lockfile; the committed root Cargo.lock of this repository is
# the resolution authority (PRD 6.5). The v3 train: muon 3, pvpnclient 4.
protun = { git = "https://github.com/ProtonVPN/protun", rev = "1c3aa646175ae12e22f17621306d403ad2a37017", features = [
    "linux",
    "local-agent",
] }
# Muon 3 (the v3 train; protun v3 requires muon ^3). GPLv3-cleared.
muon = { version = "=3.0.0", registry = "proton", default-features = false, features = [
    "transport-hyper",
    "lenient",
    "other-product",
    "unsealed",
    "login",
    "alternative-routing",
] }

# --- Serialization / schema ------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
schemars = "1"

# --- Errors / logging ------------------------------------------------------
thiserror = "2"
log = "0.4" # protun/pvpnclient logging facade (in-graph via protun); the netns ITs install a stderr logger
anyhow = "1"
base64 = "0.22.1" # already in-graph via muon->proton-srp->bcrypt (lock v0.22.1); zero new code
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- Tunnel crypto (M4 PR-2: the persistent cache's AEAD) -------------------
# The SAME AEAD the tunnel data plane uses (boringtun), already
# in-graph via protun -> pvpnclient -> proton-boringtun: zero new
# code, the WG-ecosystem audit rides the pin. XChaCha's 24-byte
# nonce makes RANDOM nonces safe without a counter.
libc = "0.2" # in-graph via nix (its own dep); O_NOFOLLOW/ELOOP only
chacha20poly1305 = "0.10"
getrandom = "0.3" # already in-graph (ring/muon paths); OS randomness

# --- System ---------------------------------------------------------------
# `poll` backs the ipc tests' deterministic readability checks (WO-R4).
# `net` backs if_nametoindex in the netns-gated integration tests (IT-1).
nix = { version = "0.31", features = ["socket", "user", "fs", "signal", "poll", "net"] } # re-exports its libc (in-graph)
zeroize = "1"

# --- Credential secret storage (M2 S5c spike; docs/spike-2026-08.md §S5c) --
# The freedesktop Secret Service store, pure Rust end to end: zbus (no
# libdbus C binding) with RustCrypto session crypto (`crypto-rust`).
# `keyring-core` is linked directly rather than through the `keyring`
# facade: the facade installs its platform store via a one-time global
# that shadows the mock store the tests inject, and PRD 16.2's
# indicative `keyring = "3"` Secret-Service path is libdbus C
# (`dbus-secret-service`/`libdbus-sys`) — deviations recorded in the
# spike. Feature pin mirrors keyring 4.1.6's own declaration.
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

# Clients --------------------------------------------------------------
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
# `wry` selects the webview runtime; `default-features = false` otherwise
# leaves Builder<R: Runtime> without a runtime to infer.
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-build = { version = "2", default-features = false }

# --- xtask tooling --------------------------------------------------------
cargo_metadata = "0.23"
toml = "1"
sha2 = "0.11"

# --- Workspace crates -----------------------------------------------------
protonwire-core = { path = "crates/core", version = "0.1.0" }
protonwire-frontend-api = { path = "crates/frontend-api", version = "0.1.0" }
protonwire-client = { path = "crates/client", version = "0.1.0" }
protonwire-ipc = { path = "crates/ipc", version = "0.1.0" }
protonwire-api = { path = "crates/api", version = "0.1.0" }
protonwire-protocol = { path = "crates/protocol", version = "0.1.0" }
protonwire-net = { path = "crates/net", version = "0.1.0" }
protonwire-policy = { path = "crates/policy", version = "0.1.0" }
protonwire-pf = { path = "crates/port-forwarding", version = "0.1.0" }
protonwire-store = { path = "crates/store", version = "0.1.0" }
proton-boringtun = { version = "=3.0.0", registry = "proton", features = ["std"] } # the v3 train's boringtun; in-graph via protun->pvpnclient 4.x; the M4 exit IT's mocked peer. The proton subtree moves as one train — PROTON_TRAIN in xtask/src/deps.rs

rtnetlink = "0.23"
tokio = { version = "1", features = ["rt", "macros"] }
futures-util = "0.3" # in-graph via rtnetlink; stream consumption in the executor + ITs
rustables = "0.9.0"
