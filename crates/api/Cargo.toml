[package]
name = "protonwire-api"
description = "Muon adapter: the required Proton API, authentication, session, and alternative-routing layer (PRD 6.5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
muon = { workspace = true }
# Peer-secret front door for wire-supplied credentials (M2 S4, S1's
# finding-10 gate): zeroizing, unregistered storage for peer values.
protonwire-core = { workspace = true }
protonwire-frontend-api = { workspace = true }
thiserror = { workspace = true }
# The engine runtime (M2 S4): declared directly for M2 exactly as the
# spike record anticipated ("tokio ... declared centrally when M2+ code
# calls them directly"); already a lockfile transitive via the pinned
# engines, so no new package enters the resolution.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time"] }
# Muon 3's rand (the os-interface 0.3.5 re-export of rand 0.10):
# StdRng implements the v3 train's CryptoRng/SeedableRng bounds.
# rand_chacha 0.3 implements the PRE-0.10 traits and does not
# satisfy muon 3's bounds (the v3 adapter migration).
rand = "0.10"
getrandom = "0.3"
# Fido2Payload zeroize-on-drop (S0 deferral landed with S4).
zeroize = { workspace = true }

[dev-dependencies]
# Test-only, for the S6 wire seam: drives the real muon hyper transport
# against the loopback responder (tokio net/time) and blocks muon's async
# engine from the sync trait (rt). Already a lockfile transitive via the
# pinned engines; recorded in docs/spike-2026-08.md (S6 addendum).
tracing-subscriber = { workspace = true }
# The S4 wire seam: a REAL SRP server for the loopback responder
# (proton-srp is muon's own SRP implementation, already a lockfile
# package via the pinned `login` feature — no new package, and the
# server side is what the hermetic login tests verify against).
proton-srp = { version = "0.8", registry = "proton", default-features = false, features = ["pgpinternal"] }
# FR-7C envelope bridge: the adapter's observed credentials round-trip
# through the store-side versioned envelope.
protonwire-store = { workspace = true }
serde_json = { workspace = true }
